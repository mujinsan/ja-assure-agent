# Prism dark theme. Sets native chrome (popovers, scrollbars, toolbar) that CSS
# can't reach; theme.py layers the finer styling on top.
[server]
# the uploader advertises this limit; agents/media.py still enforces the real
# caps per type (5 MB images, 25 MB mp4) by reading the header bytes
maxUploadSize = 25

[theme]
base = "dark"
primaryColor = "#b9c6d8"
backgroundColor = "#0a0a0c"
secondaryBackgroundColor = "#141418"
textColor = "#e6e6ea"
font = "sans serif"
